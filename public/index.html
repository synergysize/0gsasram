<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fractal Wallet Visualization</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #000;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0;
      cursor: default !important;
    }
    
    #info {
      position: absolute;
      top: 20px;
      left: 20px;
      color: white;
      z-index: 10;
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px;
      border-radius: 5px;
      font-size: 14px;
    }
    
    .legend {
      margin-bottom: 10px;
    }
    
    .legend-item {
      display: flex;
      align-items: center;
      margin-bottom: 5px;
    }
    
    .color-box {
      width: 15px;
      height: 15px;
      margin-right: 8px;
      border-radius: 3px;
    }
    
    .fartcoin {
      background-color: #8A2BE2; /* Purple */
    }
    
    .goattoken {
      background-color: #FFA500; /* Orange */
    }
    
    #controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: rgb(255, 255, 255); /* Increased brightness with full white */
      text-align: center;
      z-index: 10;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.5); /* Added glow effect for increased brightness */
    }
    
    #wallet-tooltip {
      position: absolute;
      display: none;
      background-color: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      pointer-events: none;
      z-index: 1000;
      max-width: 250px;
      transition: opacity 0.3s;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 0 10px rgba(0, 100, 255, 0.5);
    }
    .tooltip-title {
      font-weight: bold;
      margin-bottom: 5px;
      font-size: 14px;
      color: #99ddff; /* Increased brightness from #88ccff */
      text-shadow: 0 0 2px rgba(137, 204, 255, 0.5); /* Added glow for increased brightness */
    }
    .tooltip-address {
      font-family: monospace;
      font-size: 12px;
      margin-bottom: 8px;
      color: #bbddff; /* Increased brightness from #aaccff */
      word-break: break-all;
      text-shadow: 0 0 2px rgba(170, 204, 255, 0.5); /* Added glow for increased brightness */
    }
    .tooltip-holdings {
      margin-bottom: 5px;
    }
    .tooltip-fartcoin {
      color: #9A3BF2; /* Brighter purple for Fartcoin (increased from #8A2BE2) */
      text-shadow: 0 0 3px rgba(154, 59, 242, 0.5); /* Added glow */
    }
    .tooltip-goat {
      color: #FFB520; /* Brighter orange for Goattoken (increased from #FFA500) */
      text-shadow: 0 0 3px rgba(255, 181, 32, 0.5); /* Added glow */
    }
    .tooltip-total {
      margin-top: 8px;
      font-weight: bold;
      color: #ffffff;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.5); /* Added glow for increased brightness */
    }
    #pause-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 24px;
      color: red;
      display: none;
      z-index: 100;
    }
    #contract-address {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-family: monospace;
      font-size: 14px;
      color: rgb(255, 255, 255); /* Increased brightness with full white */
      text-align: center;
      z-index: 10;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.5); /* Added glow effect for increased brightness */
    }
    
    #contract-address .title {
      font-size: 16px;
      font-weight: bold;
      margin-bottom: 5px;
    }
    
    #contract-address .divider {
      height: 1px;
      background-color: rgba(255, 255, 255, 0.5);
      margin: 5px 0;
      width: 100%;
    }
    
    /* Fuel meter styles */
    #fuel-meter-container {
      position: absolute;
      bottom: 70px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      text-align: center;
      width: 200px;
    }
    
    #fuel-meter-label {
      color: rgb(255, 255, 255);
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
      text-shadow: 0 0 5px rgba(0, 150, 255, 0.8);
      letter-spacing: 2px;
    }
    
    #fuel-meter-outer {
      width: 100%;
      height: 15px;
      background-color: rgba(0, 20, 40, 0.8);
      border: 2px solid rgba(100, 200, 255, 0.8);
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 150, 255, 0.5), inset 0 0 5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }
    
    #fuel-meter-inner {
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, rgb(0, 100, 255), rgb(50, 200, 255));
      border-radius: 4px;
      transition: width 0.1s ease-out;
      box-shadow: 0 0 10px rgba(0, 150, 255, 0.8);
    }
  </style>
</head>
<body>
  <!-- Wallet overlay removed as requested -->

  <div id="pause-indicator">PAUSED. PRESS ESC TO UNPAUSE</div>
  
  <div id="controls">WASD to Move, Mouse to Look, SHIFT to Boost<br>ESC to Pause</div>
  
  <div id="fuel-meter-container">
    <div id="fuel-meter-label">JETPACK FUEL</div>
    <div id="fuel-meter-outer">
      <div id="fuel-meter-inner"></div>
    </div>
  </div>
  
  <div id="wallet-tooltip">
    <div class="tooltip-address">0x0000...0000</div>
    <div class="tooltip-holdings">
      <div class="tooltip-fartcoin">💨: 0</div>
      <div class="tooltip-goat">🐐: 0</div>
    </div>
  </div>
  
  <div id="contract-address">
    <div class="title">Fractal Wallet Visualization</div>
    <div class="divider"></div>
    <div>Contract: [insert contract address here]</div>
  </div>
  
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.150.1/build/three.module.js",
        "three/examples/jsm/controls/OrbitControls.js": "https://unpkg.com/three@0.150.1/examples/jsm/controls/OrbitControls.js",
        "three/examples/jsm/controls/FlyControls.js": "https://unpkg.com/three@0.150.1/examples/jsm/controls/FlyControls.js"
      }
    }
  </script>
  <script type="module" src="/main.js"></script>
</body>
</html>
